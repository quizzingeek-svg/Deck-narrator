# Deck Narrator Bot. Start: docker compose up -d --build   ->  http://localhost:8502
services:
  deck-narrator:
    image: deck-narrator-bot:latest
    build: .
    container_name: deck-narrator-bot
    ports:
      - "8502:8501"          # host 8502 (market sizer uses 8501) -> container 8501
    environment:             # all optional; values come from the .env file next to this file
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
      STT_API_KEY: ${STT_API_KEY:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
    volumes:
      - audio_cache:/app/data/audio_cache
    restart: unless-stopped

volumes:
  audio_cache:
